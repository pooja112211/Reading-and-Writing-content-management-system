<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novel Details | Category Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 30px 20px;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            margin: 0 auto;
            padding: 40px;
            max-width: 1200px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 3px solid #667eea;
        }
        
        .page-title {
            font-weight: 800;
            font-size: 2.8rem;
            margin: 0;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        
        .back-btn {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .back-btn:hover {
            background: linear-gradient(90deg, #3d8bf2, #00d2ff);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.6);
        }
        
        .item-details-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-bottom: 40px;
        }
        
        .image-section {
            flex: 1;
            min-width: 300px;
        }
        
        .details-section {
            flex: 2;
            min-width: 300px;
        }
        
        .item-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.5s ease;
        }
        
        .item-image:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }
        
        .image-frame {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(145deg, #f8f9ff, #ffffff);
            padding: 15px;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }
        
        .info-card {
            background: linear-gradient(145deg, #f8f9ff, #ffffff);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        
        .info-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-title i {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.3rem;
        }
        
        .description-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.1);
            line-height: 1.8;
            color: #555;
            font-size: 1.05rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }
        
        .metadata-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .meta-item {
            background: white;
            padding: 20px;
            border-radius: 15px;
            flex: 1;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-top: 4px solid #667eea;
            transition: all 0.3s ease;
        }
        
        .meta-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
        
        .meta-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .meta-value {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.2rem;
        }
        
        .actions-section {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(248, 249, 255, 0.8));
            border-radius: 20px;
            padding: 30px;
            margin-top: 40px;
            text-align: center;
            border: 2px solid rgba(102, 126, 234, 0.1);
        }
        
        .actions-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .actions-title i {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        
        .btn-update {
            background: linear-gradient(90deg, #43e97b, #38f9d7);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(67, 233, 123, 0.4);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-update:hover {
            background: linear-gradient(90deg, #36cf5e, #00e6c3);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(67, 233, 123, 0.6);
        }
        
        .btn-delete {
            background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-delete:hover {
            background: linear-gradient(90deg, #ff4757, #ff6b6b);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.6);
        }
        
        .status-badge {
            display: inline-block;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-left: 10px;
        }
        
        .category-badge {
            display: inline-block;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            .main-container {
                padding: 25px;
            }
            
            .page-title {
                font-size: 2.2rem;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            
            .item-image {
                height: 300px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-update, .btn-delete {
                width: 100%;
                justify-content: center;
            }
            
            .metadata-section {
                flex-direction: column;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div class="main-container">
        <div class="page-header">
            <h1 class="page-title">Novel Details</h1>
            <a href="javascript:history.back()" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Collection
            </a>
        </div>
        
        <div class="item-details-container">
            <div class="image-section">
                <div class="image-frame">
                    {% if details.img %}
                    <img src="{{ details.img.url }}" alt="Novel Image" class="item-image">
                    {% else %}
                    <div style="height: 400px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #667eea, #764ba2); border-radius: 20px;">
                        <i class="fas fa-book" style="font-size: 5rem; color: white; opacity: 0.8;"></i>
                    </div>
                    {% endif %}
                </div>
            </div>
            
            <div class="details-section">
                <div class="metadata-section">
                    <div class="meta-item">
                        <div class="meta-label">Novel Name</div>
                        <div class="meta-value">{{ details.name }}</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Category</div>
                        <div class="meta-value">
                            {{ details.cat }}
                            <span class="category-badge">Category</span>
                        </div>
                    </div>
                </div>
                
                <div class="info-card">
                    <h3 class="info-title">
                        <i class="fas fa-info-circle"></i> Description
                    </h3>
                    <div class="description-box">
                        {{ details.desc }}
                    </div>
                </div>
                
                
            </div>
        </div>
        
        <div class="actions-section">
            <div class="action-buttons">
                <a href="{% url 'update_novel' details.id %}" class="btn-update">
                    <i class="fas fa-edit me-2"></i> Update {{details.name}}
                </a>
                <a href="{% url 'delete_novel' details.id %}" class="btn-delete">
                    <i class="fas fa-trash-alt me-2"></i> Delete {{details.name}}
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <script>
        // Add animation to elements on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Animate image
            const image = document.querySelector('.item-image');
            if (image) {
                image.style.opacity = '0';
                image.style.transform = 'scale(0.9)';
                
                setTimeout(() => {
                    image.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    image.style.opacity = '1';
                    image.style.transform = 'scale(1)';
                }, 300);
            }
            
            // Animate info cards
            const cards = document.querySelectorAll('.info-card, .actions-section, .meta-item');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 500 + (index * 200));
            });
            
            // Add ripple effect to buttons
            document.querySelectorAll('.back-btn, .btn-update, .btn-delete').forEach(button => {
                button.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.cssText = `
                        position: absolute;
                        border-radius: 50%;
                        background: rgba(255, 255, 255, 0.7);
                        transform: scale(0);
                        animation: ripple-animation 0.6s linear;
                        width: ${size}px;
                        height: ${size}px;
                        top: ${y}px;
                        left: ${x}px;
                        pointer-events: none;
                        z-index: 1;
                    `;
                    
                    this.style.position = 'relative';
                    this.style.overflow = 'hidden';
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });
            
            // Add confirmation for delete button
            const deleteBtn = document.querySelector('.btn-delete');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', function(e) {
                    if (!confirm('Are you sure you want to delete this novel? This action cannot be undone.')) {
                        e.preventDefault();
                    }
                });
            }
            
            // Add CSS for ripple animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes ripple-animation {
                    to {
                        transform: scale(4);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
  </body>
</html>
